

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EchoNET;Username=postgres;Password=postgres
      - Jwt__Secret=ThisIsMySuperSecretKeyWithAtLeast32Characters!
    depends_on:
      - postgres
    networks:
      - echo-network

  postgres:
    image: postgres:15
    container_name: echo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: EchoNET
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - echo-network

volumes:
  postgres-data:

networks:
  echo-network: